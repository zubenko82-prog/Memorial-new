<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <title>Memorial</title>
    <style>
      :root { --font-ui: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, 'Noto Sans', 'Helvetica Neue', sans-serif; }
      html, body { color: #fff; }
      body, button, input, select, textarea { font-family: var(--font-ui); }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Telegram SDK лучше грузить перед вашим main.tsx, но внизу body -->
    <script src="https://telegram.org/js/telegram-web-app.js" crossorigin="anonymous"></script>

    <script type="module" src="/src/main.tsx"></script>

    <script>
      window.addEventListener('error', function (e) {
        var box = document.createElement('pre');
        box.style.cssText='position:fixed;left:0;right:0;bottom:0;max-height:50vh;overflow:auto;background:#111;color:#ffb4b4;padding:8px;margin:0;z-index:999999;font:12px/1.4 monospace;';
        box.textContent = 'Error: ' + (e.message || (e.error && e.error.stack) || e.error || 'unknown');
        document.body.appendChild(box);
      });
      window.addEventListener('unhandledrejection', function (e) {
        var box = document.createElement('pre');
        box.style.cssText='position:fixed;left:0;right:0;bottom:0;max-height:50vh;overflow:auto;background:#111;color:#ffb4b4;padding:8px;margin:0;z-index:999999;font:12px/1.4 monospace;';
        box.textContent = 'Rejection: ' + (e.reason && (e.reason.message || e.reason.stack || e.reason)) ;
        document.body.appendChild(box);
      });
    </script>
  </body>
</html>
