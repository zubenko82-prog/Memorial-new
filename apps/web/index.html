<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <title>Memorial</title>
    <style>
      :root { --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, Arial, "Noto Sans", "Helvetica Neue", sans-serif; }
      html, body { color: #fff; }
      body, button, input, select, textarea { font-family: var(--font-ui); }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Telegram SDK: грузим только внутри Telegram WebView -->
    <script>
      (function () {
        var ua = navigator.userAgent || "";
        var isTg = ua.indexOf("Telegram") !== -1;
        if (!isTg) return;

        var s = document.createElement("script");
        s.src = "https://telegram.org/js/telegram-web-app.js";
        s.async = true;
        s.crossOrigin = "anonymous";
        document.head.appendChild(s);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
